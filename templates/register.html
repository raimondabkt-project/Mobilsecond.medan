<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Mobil Second Medan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }

        .split-container { 
            display: flex; 
            min-height: 100vh;
            padding-top: 70px;
        }

        .left-side {
            flex: 6;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.78)),
                        url('{{ url_for('static', filename='images/background.jpg.png') }}') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
        }

        .welcome-text {
            color: white;
            padding: 0 60px;
            z-index: 5;
        }
        .welcome-text h1 {
            font-size: 4.2rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0,0,0,0.85);
        }
        .welcome-text p {
            font-size: 1.5rem;
            opacity: 0.95;
        }

        .right-side {
            flex: 4;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 25px;
        }

        .register-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px 35px;
            border: 3px solid #28a745;
        }

        .form-control {
            border-radius: 10px;
            padding: 14px 16px;
            border: 2px solid #ddd;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40,167,69,0.2);
        }

        .btn-daftar {
            background: #28a745;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-daftar:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        /* ==================== RESPONSIVE HP ==================== */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
                padding-top: 60px;
            }
            .left-side {
                display: none;
            }
            .right-side {
                flex: 1;
                padding: 30px 15px;
            }
            .register-card {
                max-width: 100%;
                padding: 30px 25px;
            }
            .welcome-text h1 {
                font-size: 2.6rem;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: #111;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='images/logo.jpg.png') }}" alt="Logo" height="40" class="me-2">
            <span>Mobil Second Medan</span>
        </a>
    </div>
</nav>

<div class="split-container">
    
    <!-- Kiri - Background -->
    <div class="left-side">
        <div class="welcome-text">
            <h1>Halo!</h1>
            <p>Daftar Akun Pembeli</p>
        </div>
    </div>

    <!-- Kanan - Form Register -->
    <div class="right-side">
        <div class="register-card">
            <div class="text-center mb-4">
                <h4 class="fw-bold">Daftar Akun Baru</h4>
                <p class="text-muted">Buat akun untuk menghubungi seller</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nama Lengkap</label>
                    <input type="text" name="nama" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Konfirmasi Password</label>
                        <input type="password" name="confirm_password" class="form-control" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-daftar text-white w-100 mt-2">
                    <i class="fas fa-user-plus me-2"></i> Daftar Sekarang
                </button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Sudah punya akun? 
                    <a href="{{ url_for('auth.login') }}" class="fw-bold text-success">Login di sini</a>
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
