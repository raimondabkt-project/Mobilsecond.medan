<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Unit Mobil - Mobil Second Medan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        .navbar { background-color: #111 !important; }
        .form-card { max-width: 900px; margin: 100px auto; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: #111;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='images/logo.jpg.png') }}" 
                 alt="Mobil Second Medan" height="42" class="me-2">
            Mobil Second Medan
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/katalog">Katalog</a></li>
                <li class="nav-item"><a class="nav-link" href="/cara_beli">Cara Beli</a></li>
                <li class="nav-item"><a class="nav-link" href="/tentang">Tentang</a></li>
                <li class="nav-item"><a class="nav-link" href="/favorit">Favorit</a></li>
            </ul>
            <div id="userInfo" class="d-flex align-items-center"></div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-card card shadow">
        <div class="card-header bg-white">
            <h4 class="fw-bold mb-0">Tambah Unit Mobil Baru</h4>
        </div>
        <div class="card-body p-5">

            <form>
                <div class="row g-4">
                    <!-- Kolom Kiri -->
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Merek Mobil</label>
                            <select class="form-select form-select-lg">
                                <option>Toyota</option>
                                <option>Honda</option>
                                <option>Suzuki</option>
                                <option>Mitsubishi</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Model</label>
                            <input type="text" class="form-control form-control-lg" placeholder="Avanza, HR-V, Innova, dll">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tahun Produksi</label>
                            <input type="number" class="form-control form-control-lg" placeholder="2020">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Harga (Rp)</label>
                            <input type="text" class="form-control form-control-lg" placeholder="185000000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kilometer (km)</label>
                            <input type="number" class="form-control form-control-lg" placeholder="45000">
                        </div>
                    </div>

                    <!-- Kolom Kanan -->
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Transmisi</label>
                            <select class="form-select form-select-lg">
                                <option>Matic</option>
                                <option>Manual</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Jenis Bahan Bakar</label>
                            <select class="form-select form-select-lg">
                                <option>Bensin</option>
                                <option>Diesel</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Warna</label>
                            <input type="text" class="form-control form-control-lg" placeholder="Putih, Hitam, Silver">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Status Unit</label>
                            <select class="form-select form-select-lg">
                                <option>Ready</option>
                                <option>Booking</option>
                                <option>Sold</option>
                            </select>
                        </div>
                    </div>

                    <!-- Deskripsi -->
                    <div class="col-12">
                        <label class="form-label fw-bold">Deskripsi Mobil</label>
                        <textarea class="form-control" rows="4" placeholder="Deskripsi lengkap mobil..."></textarea>
                    </div>

                    <!-- Upload Foto -->
                    <div class="col-12">
                        <label class="form-label fw-bold">Upload Foto Mobil</label>
                        <input type="file" name="gambar" multiple class="form-control" accept="image/*">
                        <small class="text-muted">Bisa upload multiple foto (maksimal 5 foto)</small>
                    </div>
                </div>

                <!-- Tombol -->
                <div class="mt-5 text-end">
                    <a href="dashboard_seller.html" class="btn btn-secondary btn-lg px-5 me-3">Batal</a>
                    <button type="button" onclick="simpanUnit()" class="btn btn-primary btn-lg px-5">
                        <i class="fas fa-save"></i> Simpan Unit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Floating WhatsApp -->
<a href="https://wa.me/6282268783757" class="position-fixed bottom-0 end-0 m-4 btn btn-success rounded-circle shadow-lg" 
   style="width:65px;height:65px;font-size:30px;display:flex;align-items:center;justify-content:center;z-index:9999;" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function simpanUnit() {
        alert("✅ Unit mobil berhasil disimpan!");
        window.location.href = "dashboard_seller.html";
    }
</script>
<!-- ==================== JAVASCRIPT NAVBAR DINAMIS ==================== -->
<script>
    function updateNavbar() {
        const user = localStorage.getItem('user');
        const role = localStorage.getItem('role');
        const userInfo = document.getElementById('userInfo');

        if (user && userInfo) {
            userInfo.innerHTML = `
                <span class="text-white me-3">
                    <i class="fas fa-user-circle"></i> 
                    Halo, <strong>${user}</strong> 
                    <span class="badge bg-success ms-2">${role ? role.toUpperCase() : ''}</span>
                </span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            `;
        } else if (userInfo) {
            userInfo.innerHTML = `
                <a href="/auth/login" class="btn btn-outline-light px-4">Login</a>
            `;
        }
    }

    function logout() {
        if (confirm('Yakin ingin logout?')) {
            localStorage.clear();
            window.location.href = '/';
        }
    }

    // Jalankan saat halaman dimuat
    window.addEventListener('load', updateNavbar);
</script>

</body>
</html>
