<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Seller - Mobil Second Medan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        .navbar { background-color: #111 !important; }
        .form-card { max-width: 800px; margin: 100px auto; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: #111;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="{{ url_for('static', filename='images/logo.jpg.png') }}" 
                 alt="Mobil Second Medan" height="42" class="me-2">
            Mobil Second Medan
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/katalog">Katalog</a></li>
                <li class="nav-item"><a class="nav-link" href="/cara_beli">Cara Beli</a></li>
                <li class="nav-item"><a class="nav-link" href="/tentang">Tentang</a></li>
                <li class="nav-item"><a class="nav-link" href="/favorit">Favorit</a></li>
            </ul>
            <div id="userInfo" class="d-flex align-items-center"></div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-card card shadow">
        <div class="card-header bg-white">
            <h4 class="fw-bold mb-0">Tambah Seller Baru</h4>
        </div>
        <div class="card-body p-5">

            <form>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nama Lengkap</label>
                        <input type="text" class="form-control form-control-lg" placeholder="Nama Lengkap Seller">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control form-control-lg" placeholder="seller123">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control form-control-lg" placeholder="seller@mobilsecond.medan">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">No. HP</label>
                        <input type="tel" class="form-control form-control-lg" placeholder="0812-7777-7777">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control form-control-lg" placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Konfirmasi Password</label>
                        <input type="password" class="form-control form-control-lg" placeholder="••••••••">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select form-select-lg">
                            <option>Seller</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Status Akun</label>
                        <select class="form-select form-select-lg">
                            <option>Aktif</option>
                            <option>Nonaktif</option>
                        </select>
                    </div>

                    <!-- Upload Foto Profil -->
                    <div class="col-12">
                        <label class="form-label fw-bold">Foto Profil Seller</label>
                        <input type="file" class="form-control form-control-lg" accept="image/*">
                    </div>
                </div>

                <!-- Tombol -->
                <div class="mt-5 text-end">
                    <a href="dashboard_admin.html" class="btn btn-secondary btn-lg px-5 me-3">Batal</a>
                    <button type="button" onclick="simpanSeller()" class="btn btn-primary btn-lg px-5">
                        <i class="fas fa-save"></i> Simpan Seller
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Floating WhatsApp -->
<a href="https://wa.me/6282268783757" class="position-fixed bottom-0 end-0 m-4 btn btn-success rounded-circle shadow-lg" 
   style="width:65px;height:65px;font-size:30px;display:flex;align-items:center;justify-content:center;z-index:9999;" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function simpanSeller() {
        alert("✅ Seller berhasil ditambahkan!");
        window.location.href = "dashboard_admin.html";
    }
</script>
</body>
<!-- ==================== JAVASCRIPT NAVBAR DINAMIS ==================== -->
<script>
    function updateNavbar() {
        const user = localStorage.getItem('user');
        const role = localStorage.getItem('role');
        const userInfo = document.getElementById('userInfo');

        if (user && userInfo) {
            userInfo.innerHTML = `
                <span class="text-white me-3">
                    <i class="fas fa-user-circle"></i> 
                    Halo, <strong>${user}</strong> 
                    <span class="badge bg-success ms-2">${role ? role.toUpperCase() : ''}</span>
                </span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            `;
        } else if (userInfo) {
            userInfo.innerHTML = `
                <a href="/auth/login" class="btn btn-outline-light px-4">Login</a>
            `;
        }
    }

    function logout() {
        if (confirm('Yakin ingin logout?')) {
            localStorage.clear();
            window.location.href = '/';
        }
    }

    // Jalankan saat halaman dimuat
    window.addEventListener('load', updateNavbar);
</script>

</html>
