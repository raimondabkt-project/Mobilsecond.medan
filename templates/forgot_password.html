{% extends 'base.html' %}
{% block title %}Lupa Password - Mobil Second Medan{% endblock %}

{% block content %}
<div class="container" style="margin-top: 120px; max-width: 450px;">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="fas fa-key fa-3x text-primary mb-3"></i>
                <h3 class="fw-bold">Lupa Password?</h3>
                <p class="text-muted">Masukkan email untuk menerima link reset.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold">
                    Kirim Link Reset
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}">← Kembali ke Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
